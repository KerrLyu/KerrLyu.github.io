<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Quota Game</title>
<style>:root{--navy:#1B2A49;--gold:#C9A227;--cream:#FAF7F0;--paper:#fff;--ink:#222;--mut:#6b6b6b;--line:#E3DCCB;--pos:#1E7A4C;--neg:#B3261E;--amber:#B7791F;--hold:#1E7A4C;--cheat:#B3261E;--rep:#B7791F;--hold-bg:#DDF1E6;--cheat-bg:#F9DEDB;--rep-bg:#FBEBC6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--cream:#14192A;--paper:#1E2640;--ink:#EDEAE0;--mut:#A8A99F;--line:#33405E;--pos:#58D08F;--neg:#FF8A80;--amber:#F2C14E;--hold:#58D08F;--cheat:#FF8A80;--rep:#F2C14E;--hold-bg:#1d4a35;--cheat-bg:#4d2724;--rep-bg:#4a3f12}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1{font:700 34px Cambria,Georgia,serif;margin:6px 0;color:var(--navy)}h2{font:700 20px Cambria,Georgia,serif;margin:0 0 6px;color:var(--navy)}h3{font:700 16px system-ui;margin:0 0 4px;color:var(--navy)}
@media (prefers-color-scheme:dark){h1,h2,h3{color:#F3E7BE}}
p{margin:6px 0}.wrap{max-width:640px;margin:0 auto;padding:0 16px 100px}.hostwrap{max-width:1320px;margin:0 auto;padding:0 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.top .mini{margin-left:10px;font-size:13px;color:var(--mut)}.cum{font:700 22px system-ui}.pos{color:var(--pos)}.neg{color:var(--neg)}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--mut)}.pill.on{background:var(--navy);color:#fff}.pill.done{background:#DDF1E6;color:#1E7A4C}
@media (prefers-color-scheme:dark){.pill.on{background:var(--gold);color:#14192A}.pill.done{background:#26493a;color:#cfe}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card.center{text-align:center}.cap{font-size:13px;color:var(--mut);margin-bottom:6px}
.timer{float:right;font:700 18px ui-monospace,Menlo,monospace;background:var(--navy);color:#fff;border-radius:8px;padding:1px 10px}.timer.late{background:var(--neg)}
.btn{font:600 16px system-ui;border:2px solid var(--navy);background:var(--paper);color:var(--navy);border-radius:12px;padding:12px 18px;cursor:pointer;min-height:48px}
.btn.primary{background:var(--navy);color:#fff}.btn.ghost{background:transparent}.btn.big{width:100%;font-size:18px;padding:16px}.btn:disabled{opacity:.45;cursor:default}.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
@media (prefers-color-scheme:dark){.btn{border-color:var(--gold);color:#F3E7BE}.btn.primary{background:var(--gold);color:#14192A}}
.home{max-width:420px;margin:0 auto;padding:36px 16px;text-align:center}.tag{color:var(--mut);margin:0 0 18px}.join{text-align:left}
.join label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}.join input{width:100%;font:600 20px system-ui;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
#code{letter-spacing:6px;text-transform:uppercase;text-align:center;font-size:28px}.join .btn{width:100%;margin-top:14px}
.homeLinks{display:grid;gap:10px;margin-top:18px}.fine{font-size:12px;color:var(--mut)}.note{font-size:13px;color:var(--mut);margin-top:8px}
.center{max-width:440px;margin:70px auto;text-align:center;padding:0 16px}.spinner{width:36px;height:36px;margin:0 auto 12px;border:4px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.how{text-align:left;max-width:520px;margin:10px auto}.how li{margin:6px 0}
.nettest{font-size:14px;text-align:left}.lkrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0;font-size:12px}.lk{padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut)}.lk.ok{background:var(--hold-bg);color:var(--pos)}.lk.failed{background:var(--cheat-bg);color:var(--neg)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:center;font-size:12px;color:var(--mut);padding:4px 6px;border-bottom:1px solid var(--line)}.tbl td{padding:6px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}.tbl td:first-child,.tbl th:first-child{text-align:left}
.pay td.h{color:var(--hold);font-weight:700}.pay td.c{color:var(--cheat);font-weight:700}.pay tr.me td{background:rgba(201,162,39,.15)}
.choices{display:grid;gap:10px;margin:10px 0}.choice{display:block;width:100%;text-align:left;border:3px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 16px;cursor:pointer;font:inherit}
.choice b{display:block;font-size:20px}.choice span{font-size:14px;color:var(--mut)}.choice.h b{color:var(--hold)}.choice.c b{color:var(--cheat)}
.choice.sel.h{border-color:var(--hold);background:var(--hold-bg)}.choice.sel.c{border-color:var(--cheat);background:var(--cheat-bg)}
.repbox{display:flex;gap:10px;align-items:flex-start;border:2px dashed var(--rep);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer;background:transparent;color:var(--ink);font:inherit;width:100%;text-align:left}.repbox.on{background:var(--rep-bg);border-style:solid}.repbox i{font-style:normal;font-weight:700;color:var(--rep)}
.big{font-size:18px}.result{text-align:center}.result .num{font:700 48px system-ui}.result .sub{color:var(--mut);font-size:15px}
.tag2{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px}.tag2.h{background:var(--hold-bg);color:var(--hold)}.tag2.c{background:var(--cheat-bg);color:var(--cheat)}.tag2.r{background:var(--rep-bg);color:var(--rep)}.tag2.i{background:var(--line);color:var(--mut)}
.insight{background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;margin:0 0 14px}@media (prefers-color-scheme:dark){.insight{background:#2A3355}}
.teach{background:#FFF4C9;border-radius:8px;padding:8px 12px;color:#3d3300}@media (prefers-color-scheme:dark){.teach{background:#4a3f12;color:#F6E7A8}}
.wait{color:var(--mut);font-size:14px}.warn2{background:#FFF1D6;color:#6b4a00;border-radius:8px;padding:8px 12px;font-size:14px}
.hostgrid{display:grid;gap:16px}@media (min-width:980px){.hostgrid{grid-template-columns:1fr 330px;align-items:start}.side{position:sticky;top:10px}}
.codecard{text-align:center}.code{font:700 64px/1 ui-monospace,Menlo,monospace;letter-spacing:10px;color:var(--navy);margin:2px 0}@media (prefers-color-scheme:dark){.code{color:#F3E7BE}}.lab{font-size:13px;color:var(--mut)}.qr{width:170px;margin:8px auto}.qr svg{width:100%;height:auto;background:#fff;border-radius:8px}.url{font-size:12px;word-break:break-all;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{background:var(--cream);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:14px}.chip.ok{background:var(--hold-bg);border-color:var(--pos)}.chip.off{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}.inl{font-size:14px}.inl input[type=number]{width:70px;font:600 16px system-ui;padding:6px;border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.progbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}.progbar i{display:block;height:100%;background:var(--pos);transition:width .3s}
.ctrl{display:grid;gap:10px}details summary{cursor:pointer}:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.grid{display:grid;gap:12px}@media (min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.mk{padding:10px 12px}.mk h3{display:flex;justify-content:space-between}
.dg{width:100%;border-collapse:collapse;font-size:13px}.dg td,.dg th{padding:3px 4px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.dg td:first-child{text-align:left;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}.dg th{font-size:11px;color:var(--mut)}
.cell{display:inline-block;min-width:26px;border-radius:6px;padding:1px 4px;font-weight:700;font-size:12px}.cell.H{background:var(--hold-bg);color:var(--hold)}.cell.C{background:var(--cheat-bg);color:var(--cheat)}.cell.I{background:var(--line);color:var(--mut)}.cell.W{background:transparent;color:var(--mut);border:1px dashed var(--line)}.cell.L{background:var(--navy);color:#fff}
.cell .rp{color:var(--rep);margin-left:2px}.dg tr.leadr td{background:rgba(201,162,39,.12)}
.chart{width:100%;height:auto;display:block}.axis{stroke:var(--mut);stroke-width:1.2}.gl{stroke:var(--line);stroke-width:1}.lt{font:12px system-ui;fill:var(--mut)}.lcl{fill:none;stroke:var(--navy);stroke-width:3}.lcd{fill:var(--gold);stroke:var(--navy);stroke-width:2}.bar2{fill:var(--rep);opacity:.55}
@media (prefers-color-scheme:dark){.lcl{stroke:#F3E7BE}}
.band1{fill:rgba(120,120,120,.08)}.band2{fill:rgba(30,122,76,.10)}.band3{fill:rgba(183,121,31,.12)}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:4px}
ol.q{margin:6px 0 0;padding-left:20px}ol.q li{margin:4px 0}
.lead{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}.lead b{font-variant-numeric:tabular-nums}

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      }

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

/* ---------------- charts ---------------- */
function coopChart(series, compact) {
  const w = compact ? 340 : 540, h = compact ? 210 : 230, L = compact ? 40 : 46, R = 12, T = 22, B = 30, n = series.length;
  if (!n) return '<div class="wait">No rounds played yet.</div>';
  const step = n > 1 ? (w - L - R) / (n - 1) : 0, x = i => n === 1 ? L + (w - L - R) / 2 : L + i * step, y = v => T + (1 - v) * (h - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Share of firms that held, by round">`;
  const half = n > 1 ? step / 2 : (w - L - R) / 2;
  let a = 0;
  while (a < n) { let b = a; while (b + 1 < n && series[b + 1].stage === series[a].stage) b++;
    const x0 = Math.max(L, x(a) - half), x1 = Math.min(w - R, x(b) + half);
    s += `<rect class="band${series[a].stage}" x="${x0}" y="${T}" width="${x1 - x0}" height="${h - T - B}"/><text class="lt" x="${(x0 + x1) / 2}" y="${T - 7}" text-anchor="middle">Stage ${series[a].stage}</text>`; a = b + 1; }
  [0, 0.25, 0.5, 0.75, 1].forEach(v => { s += `<line class="gl" x1="${L}" x2="${w - R}" y1="${y(v)}" y2="${y(v)}"/><text class="lt" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v * 100)}%</text>`; });
  s += `<line class="axis" x1="${L}" x2="${L}" y1="${T}" y2="${h - B}"/><line class="axis" x1="${L}" x2="${w - R}" y1="${h - B}" y2="${h - B}"/>`;
  let pts = []; series.forEach((p, i) => { if (p.rate != null) pts.push([x(i), y(p.rate)]); s += `<text class="lt" x="${x(i)}" y="${h - B + 15}" text-anchor="middle">${i + 1}</text>`; });
  if (pts.length) s += `<polyline class="lcl" points="${pts.map(p => p.join(',')).join(' ')}"/>` + pts.map(p => `<circle class="lcd" cx="${p[0]}" cy="${p[1]}" r="4.5"/>`).join('');
  s += `<text class="lt" x="${(L + w - R) / 2}" y="${h - 2}" text-anchor="middle">Round</text></svg>`;
  return s + '<div class="legend2"><span>Line: share of firms that chose HOLD</span></div>';
}

  const l = me.last; if (!l) return '<div class="card center"><p>Waiting for the round to finish.</p></div>';

  const lines = [`You chose <span class="tag2 ${l.choice === 'H' ? 'h' : 'c'}">${l.choice === 'H' ? 'HOLD' : 'CHEAT'}</span>${l.idle ? ' <span class="tag2 i">no lock-in: chosen for you</span>' : ''}${l.report ? ' and <span class="tag2 r">REPORT</span>' : ''}.`,
    `${l.k} of ${l.N} firms in your market cheated. Profit from the table: <b>${usd(l.base)}</b>.`];
  if (l.reported) lines.push(l.first ? `You were the first in your market to report: reward <b>+${usd(pub.reward).replace('$', '$')}</b>, no fine.` : (l.report ? `Someone reported before you. You pay the fine: <b>-${usd(pub.fine)}</b>.` : `Someone in your market reported. You pay the fine: <b>-${usd(pub.fine)}</b>.`));
  else if (pub.stage === 3) lines.push('Nobody in your market reported this round.');
  const who = g && g.rows ? `<div class="card"><h3>Who chose what in your market</h3>${g.rows.map(r => `<div class="lead"><span>${esc(r.name)}</span><span class="tag2 ${r.choice === 'H' ? 'h' : 'c'}">${r.choice === 'H' ? 'HOLD' : 'CHEAT'}</span></div>`).join('')}</div>` : '';
  return `<div class="card result"><div class="sub">Round ${pub.round} result</div><div class="num ${l.profit >= 0 ? 'pos' : 'neg'}">${sgn(l.profit)}</div>${lines.map(t => `<p>${t}</p>`).join('')}<p class="wait">Your total: <b>${usd(me.total)}</b></p></div>` + who +
    `<div class="card"><h3>The whole class</h3><p>${s && s.rate != null ? Math.round(s.rate * 100) + '% of firms chose HOLD this round.' : ''}</p>${coopChart(pub.series, true)}</div><p class="wait center">Waiting for the instructor.</p>`;
}
function finalView(pub, me) {
  const f = pub.final; const you = f.players.findIndex(p => p.name === me.name);
  return `<div class="card center"><h2>Game over</h2><p class="big">Your total: <b>${usd(me.total)}</b></p><p>${me.rank ? 'You finished #' + me.rank + ' of ' + me.nRank + ' firms.' : ''}</p></div>
    <div class="card"><h3>Your results by round</h3><table class="tbl"><thead><tr><th>Round</th><th>Choice</th><th>Profit</th></tr></thead><tbody>${me.hist.map(h => `<tr><td>${h.stage}.${h.round}</td><td>${h.choice === 'H' ? 'HOLD' : 'CHEAT'}</td><td>${sgn(h.profit)}</td></tr>`).join('')}</tbody></table></div>
    <div class="card"><h3>The whole class</h3>${coopChart(pub.series, true)}</div>`;

/* ---------------- host screens ---------------- */
function hostPrompt(pub) {
  const st = pub.stage, ph = pub.phase, rd = pub.round;
  if (ph === 'lobby') return 'Students scan the code and enter a nickname. You need at least 3 firms. Markets of 3 (or 4) are formed when you press Start.';
  if (ph === 'intro') return {
    1: 'Read the rules aloud and show the profit table. Do not use the words cartel, prisoner\'s dilemma or Nash yet. Say: no talking, choose in secret.',
    2: 'Say: you may talk now. Do NOT say how many rounds there will be. Let the meeting timer run each round.',
    3: 'Introduce the Antitrust Division and the reward and fine. Ask: who benefits from reporting? (Deck Part 2, public policy slide.)' }[st];
  if (ph === 'talk') return 'Let them talk face to face. Walk around and listen for promises and threats. You do not need to say anything.';
  if (ph === 'choose') return st === 1 ? 'Silence please. Watch the lock-ins; your screen shows who is in, not what they chose, unless you turn on the peek switch.' : 'Choices are secret. When everyone is in, the round reveals by itself (auto advance) or press Reveal.';
  if (ph === 'reveal') {
    if (st === 1) return rd === 1 ? 'Ask: how many cheated, and why? Ask one cheater and one holder. This is the cheating incentive (Part 2, "Why cartels crack").' : 'Ask: did cheating spread? What does a holder lose when others cheat?';
    if (st === 2) return 'Compare with Stage 1: did talking help? Watch for a drop in the last rounds. Ask: who is tempted now, and who broke a promise? (Part 2, "Playing again and again".)';
    return 'Ask: who reported and why? Reporting is never worse than staying silent, so the race to report breaks the agreement. (Part 2, "Public policy": leniency program.)';
  }
  return 'Ask the discussion questions below. Then connect to the deck: dominant strategy, Nash equilibrium, repeated play, why talking is not enough, and why leniency is the regulator\'s best tool.';
}
function nextLabel(pub) {
  const S = engine.S;
  if (pub.phase === 'lobby') return 'Start the game (form markets)';
  if (pub.phase === 'intro') return 'Start ' + 'Stage ' + pub.stage + ' (round 1)';
  if (pub.phase === 'talk') return 'End meeting, open choosing';
  if (pub.phase === 'choose') return 'Reveal results';
  if (pub.phase === 'reveal') return pub.round < pub.rounds[pub.stage] ? 'Next round' : (pub.stage < 3 ? 'Next stage (Stage ' + (pub.stage + 1) + ' rules)' : 'Finish and show the summary');
  return '';
}
function stagePills(pub) {
  return '<div class="pills">' + [1, 2, 3, 4].map(s => `<span class="pill ${pub.stage === s || (s === 4 && pub.phase === 'final') ? 'on' : (pub.phase === 'final' || pub.stage > s ? 'done' : '')}">${esc(STAGE_NAMES[s])}</span>`).join('') + '</div>';
}
function cellHTML(h) {
  if (!h) return '<span class="cell W">-</span>';
  return `<span class="cell ${h.idle ? 'I' : h.choice}">${h.choice}${h.idle ? '*' : ''}${h.report ? '<span class="rp">R' + (h.reportOrder || '') + '</span>' : ''}</span>`;
}
function marketBlock(g) {
  const S = engine.S, recs = S.hist, cur = (S.phase === 'choose' || S.phase === 'talk');
  const lastRec = recs.length ? recs[recs.length - 1].groups.find(x => x.gi === g.id) : null;
  const head = recs.map(h => `<th>${h.stage}.${h.round}</th>`).join('') + (cur ? '<th>now</th>' : '') + '<th>Total</th>';
  const rows = g.members.map(pid => {
    const p = engine.P[pid]; const byIdx = {}; p.hist.forEach(h => { byIdx[h.idx] = h; });
    let cells = recs.map(h => `<td>${cellHTML(byIdx[h.idx])}</td>`).join('');
    if (cur) { const c = p.cur; cells += '<td>' + (S.phase === 'talk' ? '<span class="cell W">talk</span>' : (c && c.locked ? (local.peek ? `<span class="cell ${c.choice}">${c.choice}${c.report ? '<span class="rp">R</span>' : ''}</span>` : '<span class="cell L">in</span>') : '<span class="cell W">...</span>')) + '</td>'; }
    return `<tr><td title="${esc(p.name)}">${esc(p.name)}${p.connected ? '' : ' (off)'}</td>${cells}<td><b>${usd(p.total)}</b></td></tr>`;
  }).join('');
  const sum = g.members.reduce((s, m) => s + engine.P[m].total, 0);
  return `<div class="card mk"><h3><span>${esc(g.name)}</span><span class="r wait">${lastRec ? 'last round: ' + lastRec.k + ' of ' + lastRec.N + ' cheated' : g.members.length + ' firms'}</span></h3><div style="overflow-x:auto"><table class="dg"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table></div><div class="wait">Market total ${usd(sum)}</div></div>`;
}
function gridHTML() {
  const S = engine.S; if (!S.groups.length) return '';
  return `<div class="grid">${S.groups.map(marketBlock).join('')}</div><div class="note">H = HOLD, C = CHEAT, R = reported (R1 = first), * = no lock-in so HOLD was chosen for the student. Only you see this grid when the hide switch is off.</div>`;
}
function leaderboard() {
  const fb = engine.finalBoard();
  return `<div class="card"><h3>Markets by average profit per firm</h3>${fb.groups.map((g, i) => `<div class="lead"><span>${i + 1}. ${esc(g.name)} <span class="wait">(${g.n} firms)</span></span><b>${usd(g.avg)}</b></div>`).join('')}
  <h3 style="margin-top:12px">Top firms</h3>${fb.players.slice(0, 5).map((p, i) => `<div class="lead"><span>${i + 1}. ${esc(p.name)} <span class="wait">${esc(p.group)}</span></span><b>${usd(p.total)}</b></div>`).join('')}</div>`;
}
function roundSummary() {
  const S = engine.S, rec = S.hist[S.hist.length - 1]; if (!rec) return '';
  const cheats = rec.groups.reduce((s, g) => s + g.k, 0), n = rec.groups.reduce((s, g) => s + g.N, 0);
  let rep = '';
  if (rec.stage === 3) rep = '<h3 style="margin-top:10px">Reports this round</h3>' + (rec.reports ? rec.groups.map(g => { const rs = g.rows.filter(r => r.report).sort((a, b) => a.reportOrder - b.reportOrder); return rs.length ? `<div class="lead"><span>${esc(g.name)}</span><span>${rs.map(r => esc(r.name) + ' (R' + r.reportOrder + ')').join(', ')}</span></div>` : ''; }).join('') : '<div class="wait">Nobody reported.</div>');
  return `<div class="card"><h3>This round</h3><p><b>${Math.round((rec.coop == null ? 0 : rec.coop) * 100)}%</b> of firms held (${n - cheats} of ${n}).${rec.nIdle ? ' ' + rec.nIdle + ' did not lock in.' : ''}</p>${rep}</div>`;
}
function marketSummary() {
  const S = engine.S;
  return S.groups.map(g => {
    let first = null, allHold = 0, reps = 0;
    S.hist.forEach(h => { const gr = h.groups.find(x => x.gi === g.id); if (!gr) return; if (gr.k === 0) allHold++; if (gr.k > 0 && first === null) first = h.idx; reps += gr.rows.filter(r => r.report).length; });
    return { name: g.name, first, allHold, reps };
  });
}
function stageAverages() {
  const S = engine.S; const out = {};
  [1, 2, 3].forEach(s => { const rs = S.hist.filter(h => h.stage === s && h.coop != null); out[s] = rs.length ? rs.reduce((a, h) => a + h.coop, 0) / rs.length : null; });
  return out;
}
function finalHTML() {
  const S = engine.S, avg = stageAverages(), ms = marketSummary();
  return `<div class="card"><h2>Summary</h2><p>Share of choices that were HOLD: Stage 1 <b>${avg[1] == null ? '-' : Math.round(avg[1] * 100) + '%'}</b>, Stage 2 <b>${avg[2] == null ? '-' : Math.round(avg[2] * 100) + '%'}</b>, Stage 3 <b>${avg[3] == null ? '-' : Math.round(avg[3] * 100) + '%'}</b>.</p>${coopChart(engine.classSeries())}</div>
    <div class="card"><h3>By market</h3><table class="tbl"><thead><tr><th>Market</th><th>First cheating in round</th><th>Rounds with no cheating</th><th>Reports</th></tr></thead><tbody>${ms.map(m => `<tr><td>${esc(m.name)}</td><td>${m.first == null ? 'never' : m.first}</td><td>${m.allHold}</td><td>${m.reps}</td></tr>`).join('')}</tbody></table></div>
    ${leaderboard()}
    <div class="card"><h3>Discussion questions</h3><ol class="q"><li>In Stage 1, what did most firms choose? Why is CHEAT the best choice whatever the others do?</li><li>Everyone would earn $100 if all held, yet most ended up near $60. What does that say about a cartel?</li><li>In Stage 2, did talking help? Why did promises break, especially near the end?</li><li>In Stage 3, did anyone report? What did the reward and the fine do to trust inside a market?</li><li>Which of these ideas match the real cases in the deck (OPEC, airlines, the lysine and vitamin cartels)?</li></ol></div>`;
}
function renderHost() {
  if (role !== 'host') return; const pub = engine.publicView(), S = engine.S; const code = pub.code;
  const url = joinURL(code); let qr = '';
  try { const q = qrcode(0, 'M'); q.addData(url); q.make(); qr = q.createSvgTag({ cellSize: 3, margin: 2, scalable: true }); } catch (e) { }
  const P = engine.P, ids = engine.ids(); let main = '';
  if (pub.phase === 'lobby') {
    const sizes = engine.previewSizes();
    main = `<div class="card"><h2>Waiting for students</h2><p>Students open the link or scan the code, type the room code <b>${esc(code)}</b> and a nickname. ${ids.length} joined so far.</p>
      ${location.protocol === 'file:' ? '<p class="warn2">This page is open as a file on your computer, so the link and QR code will not work for students. Open it from its web address instead.</p>' : ''}
      <div class="chips">${ids.map(id => `<span class="chip ${P[id].connected ? '' : 'off'}">${esc(P[id].name)}${P[id].bot ? ' (practice)' : ''}</span>`).join('') || '<i>nobody yet</i>'}</div>
      <p>${sizes.length ? 'Markets when you press Start: <b>' + sizes.join(' + ') + '</b> firms (' + sizes.length + ' markets).' : 'Markets form when at least 3 firms have joined.'}</p>
      <div class="row"><button class="btn ghost sm" onclick="ui.addBots(1)">Add 1 practice firm</button><button class="btn ghost sm" onclick="ui.addBots(3)">Add 3 practice firms</button><span class="wait">Practice firms play by themselves so you can try the game alone.</span></div>
      <details open><summary><b>Settings</b></summary><div class="row">
      <label class="inl">Meeting seconds <input id="tt" type="number" min="0" max="600" value="${S.timers.talk}" onchange="ui.setTimers()"></label>
      <label class="inl">Choosing seconds <input id="tc" type="number" min="0" max="600" value="${S.timers.choose}" onchange="ui.setTimers()"></label>
      <label class="inl">Stage 1 rounds <input type="number" min="1" max="8" value="${S.rounds[1]}" onchange="ui.setRounds(1,this.value)"></label>
      <label class="inl">Stage 2 rounds <input type="number" min="1" max="10" value="${S.rounds[2]}" onchange="ui.setRounds(2,this.value)"></label>
      <label class="inl">Stage 3 rounds <input type="number" min="1" max="8" value="${S.rounds[3]}" onchange="ui.setRounds(3,this.value)"></label>
      <label class="inl">Fine <input id="fn" type="number" min="0" max="500" value="${S.fine}" onchange="ui.setMoney()"></label>
      <label class="inl">Reward <input id="rw" type="number" min="0" max="500" value="${S.reward}" onchange="ui.setMoney()"></label>
      <label class="inl"><input type="checkbox" ${S.auto ? 'checked' : ''} onchange="ui.setAuto(this.checked)"> Auto advance (meeting ends, everyone locked in)</label>
      <label class="inl"><input type="checkbox" ${S.showWho ? 'checked' : ''} onchange="ui.setShowWho(this.checked)"> Show each market who chose what</label></div></details></div>`;
  } else if (pub.phase === 'intro') {
    const un = engine.unassignedCount();
    main = `<div class="card"><h2>${esc(STAGE_NAMES[pub.stage])}</h2>${rulesList(pub.stage, pub)}<p class="teach">${esc(hostPrompt(pub))}</p>${un ? `<p class="warn2">${un} student(s) joined late and are waiting. <button class="btn sm" onclick="ui.addLate()">Place them in markets</button></p>` : ''}</div>` + (local.hideGrid ? '' : gridHTML());
  } else if (pub.phase === 'talk' || pub.phase === 'choose') {
    const pr = pub.progress; const ph = pub.phase;
    main = `<div class="card"><h2>${esc(STAGE_NAMES[pub.stage])}, round ${pub.round} of ${pub.stage === 2 ? pub.rounds[2] + ' (do not announce)' : pub.rounds[pub.stage]} ${timerHTML(pub)} <span class="wait">${ph === 'talk' ? 'meeting time' : 'students are choosing'}</span></h2>
      <p class="teach">${esc(hostPrompt(pub))}</p>
      ${ph === 'choose' ? `<div class="progbar"><i style="width:${pr.total ? pr.locked / pr.progress * 100 : 0}%"></i></div><div class="note">${pr.locked} of ${pr.total} locked in</div>
      <div class="chips">${engine.assigned().map(id => `<span class="chip ${P[id].cur && P[id].cur.locked ? 'ok' : ''} ${P[id].connected ? '' : 'off'}">${esc(P[id].name)} ${P[id].cur && P[id].cur.locked ? '&#10003;' : '...'}</span>`).join('')}</div>` : ''}
      <label class="inl"><input type="checkbox" ${local.peek ? 'checked' : ''} onchange="ui.setPeek(this.checked)"> Peek at choices as they come in (do not project this screen)</label></div>` + (local.hideGrid ? '' : gridHTML());
  } else if (pub.phase === 'reveal') {
    main = `<div class="card"><h2>Round ${pub.round} results <span class="wait">${esc(STAGE_NAMES[pub.stage])}</span></h2><p class="teach">${esc(hostPrompt(pub))}</p></div>` + roundSummary() + (local.hideGrid ? '' : gridHTML()) + `<div class="card"><h3>Class share of HOLD by round</h3>${coopChart(engine.classSeries())}</div>` + leaderboard();
  } else main = finalHTML() + (local.hideGrid ? '' : gridHTML());
  let ctrl = '';
  if (pub.phase !== 'final') {
    ctrl = `<div class="card ctrl"><button class="btn primary big" onclick="ui.next()" ${pub.phase === 'lobby' && ids.filter(i => P[i].connected).length < 3 ? 'disabled' : ''}>${esc(nextLabel(pub))}</button>
    ${pub.phase === 'talk' || pub.phase === 'choose' ? '<button class="btn ghost" onclick="ui.extend(30)">+30 seconds</button>' : ''}
    ${pub.phase === 'reveal' ? '<button class="btn ghost" onclick="ui.addRound()">One more round in this stage</button>' + (pub.round < pub.rounds[pub.stage] ? '<button class="btn ghost" onclick="ui.endStage()">End this stage now</button>' : '') : ''}
    ${pub.phase !== 'lobby' ? `<label class="inl"><input type="checkbox" ${S.auto ? 'checked' : ''} onchange="ui.setAuto(this.checked)"> auto advance</label>` : ''}</div>`;
  }
  const tools = `<div class="card"><label class="inl"><input type="checkbox" ${local.hideGrid ? 'checked' : ''} onchange="ui.setHide(this.checked)"> Hide the decision grid (when projecting)</label><div class="row"><button class="btn ghost sm" onclick="ui.csv()">Download CSV of every choice</button></div></div>`;
  const side = `<aside class="side"><div class="card codecard"><div class="lab">Room code</div><div class="code">${esc(code)}</div><div class="qr">${qr}</div><div class="url">${esc(url)}</div><div class="lkrow">${linkStatusHTML()}</div></div>${ctrl}${pub.phase !== 'lobby' ? tools : ''}</aside>`;
  app.innerHTML = `<div class="hostwrap"><header class="top"><div><b>The Quota Game</b><span class="mini">instructor</span></div>${stagePills(pub)}</header><div class="hostgrid"><main>${main}</main>${side}</div></div>`;
  updateDynamic();
}
const ui = {
  join() {
    const code = ($('#code').value || '').trim().toUpperCase(), name = ($('#name').value || '').trim();
    const m = $('#joinmsg'); if (code.length !== 4) { m.textContent = 'Type the 4 letter room code.'; return; } if (!name) { m.textContent = 'Type a name or nickname.'; return; }
    startClient(code, name);
  },
  rejoin() { try { const l = JSON.parse(store.get('cg-last')); startClient(l.code, l.name); } catch (e) { } },

};
